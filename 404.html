<!DOCTYPE html>
<html lang="fr" data-lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Page introuvable — Aqua Vapor Elite</title>
  <meta name="theme-color" content="#050608" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #050608; --bg-card: #0E1116; --white: #F4F8FC;
      --silver: #A9C0D6; --silver-light: #C5D8EA; --muted: #708EAA;
      --cta: #1A90D9; --cta-hover: #2AACFF; --border: rgba(140,170,200,0.14);
      --font-display: 'Bricolage Grotesque', sans-serif; --font-body: 'Montserrat', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body); background: var(--bg-deep); color: var(--silver);
      min-height: 100dvh; display: grid; place-items: center; text-align: center;
      padding: 32px; overflow: hidden; position: relative;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(60% 50% at 50% 0%, rgba(26,144,217,0.10), transparent 70%),
        radial-gradient(50% 40% at 50% 100%, rgba(11,95,160,0.08), transparent 70%);
    }
    .wrap { position: relative; z-index: 1; max-width: 560px; }
    .tag {
      font-size: 11px; letter-spacing: 0.42em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 28px;
    }
    .code {
      font-family: var(--font-display); font-weight: 700; line-height: 0.9;
      font-size: clamp(96px, 22vw, 200px); letter-spacing: -0.04em;
      background: linear-gradient(180deg, var(--white), var(--silver-light) 55%, var(--muted));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      font-variant-numeric: tabular-nums;
    }
    h1 {
      font-family: var(--font-display); font-weight: 600; color: var(--white);
      font-size: clamp(22px, 4vw, 30px); letter-spacing: -0.01em; margin: 14px 0 14px;
      text-wrap: balance;
    }
    p { font-size: 15px; line-height: 1.7; color: var(--silver); text-wrap: pretty; margin-bottom: 36px; }
    .actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 9px; padding: 14px 28px;
      border-radius: 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
      text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
    }
    .btn:active { transform: translateY(1px) scale(0.99); }
    .btn-primary { background: var(--cta); color: #fff; box-shadow: 0 14px 38px rgba(7,14,26,0.55); }
    .btn-primary:hover { background: var(--cta-hover); transform: translateY(-2px); }
    .btn-ghost { color: var(--silver-light); border: 1px solid var(--border); }
    .btn-ghost:hover { color: #fff; border-color: var(--silver-light); transform: translateY(-2px); }
    .en { display: none; }
    [data-lang="en"] .fr { display: none; }
    [data-lang="en"] .en { display: inline; }
    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="tag">Aqua Vapor Elite</p>
    <div class="code">404</div>
    <h1>
      <span class="fr">Cette page s'est évaporée</span>
      <span class="en">This page has evaporated</span>
    </h1>
    <p>
      <span class="fr">Le lien que vous suivez n'existe pas ou a été déplacé. Revenons à l'essentiel.</span>
      <span class="en">The link you followed doesn't exist or has moved. Let's get you back on track.</span>
    </p>
    <div class="actions">
      <a href="/" class="btn btn-primary">
        <span class="fr">Retour à l'accueil</span>
        <span class="en">Back to home</span>
      </a>
      <a href="/#reservation" class="btn btn-ghost">
        <span class="fr">Obtenir mon devis</span>
        <span class="en">Get my quote</span>
      </a>
    </div>
  </main>
</body>
</html>
